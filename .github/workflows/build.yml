name: CI/CD Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy files to server
        run: |
          ssh -o StrictHostKeyChecking=no nccsoft@172.16.100.117 "mkdir -p ~/myapp"
          rsync -avz --delete ./ nccsoft@172.16.100.117:~/myapp

      - name: Build & Restart app on server
        run: |
          ssh -o StrictHostKeyChecking=no nccsoft@172.16.100.117 << 'EOF'
            cd ~/myapp
            npm install
            npm run build
            pm2 restart myapp || pm2 start npm --name "myapp" -- start
          EOF
